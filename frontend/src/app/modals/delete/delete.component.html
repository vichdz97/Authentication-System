<div class="max-w-xl bg-sky-400/90 text-slate-100 p-10 m-5 rounded-xl flex flex-col gap-4">
    <h5 class="text-center text-xl font-bold">Are you sure you want to <span class="text-red-600">delete</span> this account?</h5>
    <p class="text-center">
        All information associated with <strong>{{ role }} {{ name }}</strong> will be permanently deleted.
        <br class="md:hidden" />
        <span class="text-red-600">This operation cannot be undone!</span>
    </p>
    <div class="flex gap-2">
        <button class="flex-1 bg-slate-500 p-2 rounded-full transition-colors hover:bg-slate-600" (click)="closeModal()">No</button>
        <button class="flex-1 p-2 rounded-full text-slate-100 bg-red-600 transition-colors hover:bg-red-700" 
            (click)="deleteUser(user.id)">
            Delete
        </button>
    </div>
</div>
