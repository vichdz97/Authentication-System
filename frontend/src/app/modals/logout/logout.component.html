<div class="max-w-xl bg-sky-400/90 text-slate-100 p-10 m-5 rounded-xl flex flex-col gap-4">
    <h5 class="text-center text-xl font-bold">Are you sure you want to logout?</h5>
    <p class="text-center">Any unsaved work will be lost.</p>
    <div class="flex gap-2">
        <button 
            class="flex-1 bg-slate-500 p-2 rounded-full transition-colors hover:bg-slate-600" 
            (click)="closeModal()">
            No
        </button>
        <button 
            class="flex-1 p-2 rounded-full text-slate-100 bg-amber-500 transition-colors hover:bg-amber-600" 
            (click)="logout()">
            Logout
        </button>
    </div>
</div>
