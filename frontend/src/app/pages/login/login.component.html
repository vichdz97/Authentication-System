<div class="min-h-screen w-1/2 md:w-1/3 mx-auto flex flex-col justify-center items-center">
    <form 
        class="w-full flex flex-col items-center gap-2"
        [formGroup]="loginForm" 
        (ngSubmit)="onSubmit()"
    >
        <h1 class="w-screen mb-2 text-center text-slate-100 text-4xl font-bold">Welcome Back!</h1>
        <p class="text-red-500">{{ invalidMsg }}</p>
        <div class="w-full flex flex-col items-center gap-1">
            <input 
                class="w-full px-3 py-2 bg-slate-100 rounded-2xl placeholder-sm placeholder-slate-400"
                type="text" 
                id="username" 
                formControlName="username"
                placeholder="Username"
                [ngStyle]="usernameControl.invalid && (usernameControl.dirty || usernameControl.touched) ? {'border-color':'#dc3545'} : {}"
            />
            <app-inline-error [control]="usernameControl"></app-inline-error>
        </div>
        <div class="w-full flex flex-col items-center gap-1">
            <input 
                class="w-full px-3 py-2 bg-slate-100 rounded-2xl placeholder-sm placeholder-slate-400"
                type="password" 
                id="password" 
                formControlName="password" 
                placeholder="Password"
                [ngStyle]="passwordControl.invalid && (passwordControl.dirty || passwordControl.touched) ? {'border-color':'#dc3545'} : {}"
            />
            <app-inline-error [control]="passwordControl"></app-inline-error>
        </div>
        <button type="submit" class="bg-blue-500 w-full my-4 px-3 py-2 rounded-2xl text-slate-100 transition-colors hover:bg-blue-600">Login</button>
    </form>
    <a class="text-blue-500 text-center transition-colors hover:text-blue-600" routerLink="/signup">
        Don't have an account? <br class="md:hidden">Sign up!
    </a>
</div>
