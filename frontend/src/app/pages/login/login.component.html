<app-navbar></app-navbar>
<div class="min-h-screen w-1/2 md:w-1/3 mx-auto flex flex-col justify-center items-center">
    <form 
        class="w-full flex flex-col items-center gap-2"
        [formGroup]="loginForm" 
        (ngSubmit)="onSubmit()"
    >
        <h1 class="w-screen text-center text-slate-100 text-4xl font-bold">Welcome Back!</h1>
        <div class="w-full flex flex-col items-center gap-1 mt-1">
            <input 
                class="w-full px-3 py-2 bg-slate-100 rounded-2xl placeholder-sm placeholder-slate-400 border-2
                    {{ hasErrors(usernameControl) ? 'border-red-600' : 'border-none' }}
                    focus:outline-sky-500"
                type="text" 
                id="username" 
                formControlName="username"
                placeholder="Username"
            />
            <app-inline-error [control]="usernameControl"></app-inline-error>
        </div>
        <div class="w-full flex flex-col items-center gap-1">
            <div class="w-full flex items-center relative">
                <input 
                    class="w-full px-3 py-2 bg-slate-100 rounded-2xl placeholder-sm placeholder-slate-400 border-2
                        {{ hasErrors(passwordControl) ? 'border-red-600' : 'border-none' }}
                        focus:outline-sky-500"
                    [type]="hidden ? 'password' : 'text'" 
                    id="password" 
                    formControlName="password" 
                    placeholder="Password"
                />
                <lucide-icon
                    [name]="hidden ? 'eye' : 'eye-closed'"
                    class="absolute top-0 right-0 m-1 text-slate-400 transition-colors hover:text-slate-500"
                    (click)="togglePassword()"
                />
            </div>
            <app-inline-error [control]="passwordControl"></app-inline-error>
        </div>
        <button
            class="bg-blue-500 w-full my-4 px-3 py-2 rounded-2xl text-slate-100 
                transition-colors hover:bg-blue-600 focus:outline-sky-500"
            type="submit"
        >
            Login
        </button>
    </form>
    <a class="text-blue-500 text-center transition-colors hover:text-blue-600 focus:outline-sky-500" routerLink="/signup">
        Don't have an account? <br class="md:hidden">Sign up!
    </a>
</div>
