<div class="w-full p-4 fixed top-0 z-50 backdrop-blur-md">
    <nav class="flex justify-between items-center text-slate-100">
        <h1 class="flex items-center gap-2">
            <lucide-icon name="shield-user" class="text-slate-100" size="40" strokeWidth="1" />
            <span class="font-semibold hover:cursor-default">Authentication System</span>
        </h1>

        <ul class="flex items-center gap-4">
            @if (user) {
                <li>Welcome, {{ user.username }}!</li>
                <li class="transition-all hover:opacity-80">
                    <a class="hover:cursor-default focus:outline-sky-500" routerLink="/login">Logout</a>
                </li>
            }
            @else {
                <li class="transition-all hover:opacity-80">
                    <a class="hover:cursor-default focus:outline-sky-500" routerLink="/login">Login</a>
                </li>
                <li class="transition-all hover:opacity-80">
                    <a class="hover:cursor-default focus:outline-sky-500" routerLink="/signup">Sign Up</a>
                </li>
            }
        </ul>
    </nav>
</div>
